# Аналогично waybar: конфиг swaync лежит в ~/.config/hypr/swaync/.
# Заодно чиним ExecReload: vendor-версия перечисляла две команды через ';' без шелла,
# systemd воспринимал это как аргументы.
[Service]
ExecStart=
ExecStart=/usr/bin/swaync -c %h/.config/hypr/swaync/config.json -s %h/.config/hypr/swaync/style.css

ExecReload=
ExecReload=/usr/bin/swaync-client -R -rs
