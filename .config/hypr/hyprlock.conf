# hyprlock — минимум, который работает: фон-цвет, имя пользователя, поле ввода, раскладка.
#
# Нет `path = screenshot`, blur, `cmd[update:...]`, `immediate_render`: всё это способы
# не отрисовать кадр за 5 секунд, и тогда Hyprland показывает экран lockdead
# («локскрин не поднялся»), а залоченная сессия остаётся висеть.
#
# Синтаксис проверяется без залокa экрана (к вымышленному display hyprlock не подключится,
# но конфиг успеет распарситься):
#   hyprlock --display wayland-NONEXISTENT -c ~/.config/hypr/hyprlock.conf 2>&1 | grep -i 'config has errors'
#
# Запуск — через hypridle (general:lock_cmd), не напрямую. Пароль — обычный пользовательский (PAM).
# Очистка буфера пароля: Esc, Ctrl+U, Ctrl+Backspace. Раскладка: клик по надписи или Win+Space.

general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(20, 20, 30, 1.0)
}

label {
    monitor =
    text = $USER
    font_size = 36
    color = rgba(205, 214, 244, 1.0)

    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 55
    position = 0, -20
    halign = center
    valign = center

    outline_thickness = 3
    rounding = 15

    dots_size = 0.2
    dots_spacing = 0.3

    outer_color = rgba(51, 204, 255, 1.0)
    inner_color = rgba(30, 30, 46, 1.0)
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    font_color = rgb(205, 214, 244)

    fade_on_empty = false
    placeholder_text = Password...
    fail_text = $PAMFAIL
}

# список меток в $LAYOUT[...] = порядок input:kb_layout (у нас "us, ru")
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 22
    color = rgba(147, 153, 178, 1.0)
    onclick = hyprctl switchxkblayout all next

    position = 0, 70
    halign = center
    valign = center
}
