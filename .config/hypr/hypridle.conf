# hypridle — таймеры бездействия + блокировка перед сном.
#
# Диспетчеры Hyprland только в Lua-виде (конфиг Hyprland на Lua):
#   hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
# текстовый `hyprctl dispatch dpms off` падает с Lua-ошибкой.
#
# Проверка: systemctl --user restart hypridle && journalctl --user-unit=hypridle -n 20  (→ "found 3 rules")

general {
    # Все залок-действия в сессии должны идти через `loginctl lock-session` (waybar, wlogout,
    # бинды, таймеры ниже) — только тогда работает гард от дублей ниже.
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    # Перед сном залочить сессию; после пробуждения включить мониторы
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 10 минут — блокировка (hypridle выполнит lock_cmd -> hyprlock)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 20 минут — погасить мониторы
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 минут — сон (перед этим выполнится before_sleep_cmd)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
